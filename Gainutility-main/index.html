    <!-- Fonts: trimmed weights; PDF.js is lazy-loaded on demand (see src/lib/pdfJsLoader.ts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Apply the saved (or OS) theme before first paint so the page never
         flashes light while the app is in dark mode. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("premium-suite-theme");
          var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="selection:bg-[#D97A3F] selection:text-white antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
